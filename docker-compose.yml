version: '3.8'

services:
  opencart:
    build: .
    container_name: opencart
    restart: unless-stopped
    depends_on:
      - mysql
    ports:
      - "8080:80"
    # IMPORTANT: mount only the writable storage subfolders. Do NOT mount the
    # whole system/storage folder — it contains the committed Composer vendor
    # (system/storage/vendor) that OpenCart needs to render (Twig). Covering it
    # with an empty volume breaks the storefront.
    volumes:
      - opencart_storage_cache:/var/www/html/system/storage/cache
      - opencart_storage_logs:/var/www/html/system/storage/logs
      - opencart_storage_session:/var/www/html/system/storage/session
      - opencart_storage_upload:/var/www/html/system/storage/upload
      - opencart_storage_download:/var/www/html/system/storage/download
      - opencart_storage_modification:/var/www/html/system/storage/modification
      - opencart_storage_sass:/var/www/html/system/storage/sass
    environment:
      - MYSQLHOST=mysql
      - MYSQLPORT=3306
      - MYSQLUSER=root
      - MYSQLPASSWORD=opencart_password
      - MYSQLDATABASE=opencart
      - HTTP_SERVER=http://localhost:8080
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=opencart
      - ADMIN_EMAIL=admin@example.com
    networks:
      - opencart-net

  mysql:
    image: mariadb:10.6
    container_name: opencart-mysql
    restart: unless-stopped
    environment:
      - MYSQL_DATABASE=opencart
      - MYSQL_ROOT_PASSWORD=opencart_password
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - opencart-net

volumes:
  opencart_storage_cache:
  opencart_storage_logs:
  opencart_storage_session:
  opencart_storage_upload:
  opencart_storage_download:
  opencart_storage_modification:
  opencart_storage_sass:
  mysql_data:

networks:
  opencart-net:
    driver: bridge
